# Used by `uv run alembic revision --autogenerate -m "..."` when adding tables.
# Day to day, run migrations with `sna db upgrade` (or `make migrate`).
# The database URL comes from DATABASE_URL / .env.
[alembic]
script_location = %(here)s/src/stock_news_analyzer/migrations
file_template = %%(rev)s_%%(slug)s
