[project]
name = "stock-news-analyzer"
version = "0.1.0"
description = "Agents that track news, filings and earnings calls for Indian stocks and bullion, and build a point-in-time research database."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "rapidfuzz>=3.14.6",
    "pyyaml>=6.0.3",
    "curl-cffi>=0.16.3",
    "pypdf>=6.21.1",
    "feedparser>=6.0.14",
    "apscheduler>=3.10,<4",
]

[project.scripts]
sna = "stock_news_analyzer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_news_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: tests that need a running Postgres (skipped when it is unreachable)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/stock_news_analyzer/migrations/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as argument defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
