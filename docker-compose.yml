# The whole system: `docker compose up -d` (or the start script) starts the database,
# applies database changes, then the dashboard and the scheduler.
# Pinned so the data volume keeps its name whatever the folder is called.
name: stock_news_analyzer

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sna
      POSTGRES_PASSWORD: sna
      POSTGRES_DB: sna
      TZ: Asia/Kolkata
    ports:
      # 5433 on the laptop, so it does not clash with a Postgres you may already run on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sna -d sna"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    # Brings the database up to date (`sna db upgrade`), then exits; the dashboard and the
    # scheduler wait for it.
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sna:sna@db:5432/sna
    depends_on:
      db:
        condition: service_healthy
    command: ["sna", "db", "upgrade"]

  app:
    # One-off checks: `docker compose run --rm app sna health`.
    profiles: ["tools"]
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Docker the database is reached by its service name, not localhost.
      DATABASE_URL: postgresql+psycopg://sna:sna@db:5432/sna
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: ["sna", "health"]

  scheduler:
    # The orchestrator: runs jobs on config/schedule.yaml.
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sna:sna@db:5432/sna
      DATA_DIR: /app/data
      TZ: Asia/Kolkata
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["sna", "orchestrator", "start"]

  ui:
    # The dashboard, at http://localhost:8501.
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sna:sna@db:5432/sna
      DATA_DIR: /app/data
      TZ: Asia/Kolkata
    ports:
      # This computer only: not reachable from other machines on the network.
      - "127.0.0.1:8501:8501"
    volumes:
      # Writable: "Load history" on Manage stocks saves filing PDFs here.
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["streamlit", "run", "src/stock_news_analyzer/ui/app.py",
              "--server.address", "0.0.0.0", "--server.headless", "true"]

volumes:
  pgdata:
