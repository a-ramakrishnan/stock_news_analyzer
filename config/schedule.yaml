# When each job runs, as cron expressions in India time (minute hour day month weekday).
# Used by `sna orchestrator start`. Run any job by hand with `sna run <job>`.
# Set `enabled: false` to pause a job. After editing, restart the orchestrator.
jobs:
  filings:       # new BSE + NSE announcements
    cron: "*/30 7-23 * * *"
  news:          # news feeds + Google News
    cron: "15 6-23 * * *"
  triage:        # LLM (Haiku): relevance, topic, sentiment, importance of new articles
    cron: "25 6-23 * * *"
  prices:        # NSE prices (published around 18:00), corporate actions, moves and labels
    cron: "30 19,21 * * 1-5"
  deals:         # NSE bulk and block deals (published in the evening)
    cron: "0 19,22 * * 1-5"
  explain:       # LLM (Sonnet): likely cause of each unusual day, before the morning digest
    cron: "45 7 * * *"
  securities:    # NSE/BSE company lists (new listings, symbol changes, market caps)
    cron: "0 9 * * 0"
  digest:        # daily report covering everything since the previous digest
    cron: "0 8 * * *"
