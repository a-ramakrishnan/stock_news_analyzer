services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sna
      POSTGRES_PASSWORD: sna
      POSTGRES_DB: sna
      TZ: Asia/Kolkata
    ports:
      # 5433 on the laptop, so it does not clash with a Postgres you may already run on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sna -d sna"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Docker the database is reached by its service name, not localhost.
      DATABASE_URL: postgresql+psycopg://sna:sna@db:5432/sna
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: ["sna", "health"]

  scheduler:
    # The orchestrator: runs jobs on config/schedule.yaml. Start with `make scheduler`.
    build: .
    profiles: ["scheduler"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sna:sna@db:5432/sna
      DATA_DIR: /app/data
      TZ: Asia/Kolkata
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["sna", "orchestrator", "start"]

  ui:
    # The dashboard (read-only). Start with `make ui-docker`, open http://localhost:8501.
    build: .
    profiles: ["ui"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sna:sna@db:5432/sna
      DATA_DIR: /app/data
      TZ: Asia/Kolkata
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["streamlit", "run", "src/stock_news_analyzer/ui/app.py",
              "--server.address", "0.0.0.0", "--server.headless", "true"]

volumes:
  pgdata:
