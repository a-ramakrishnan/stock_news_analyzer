[project]
name = "stock-news-analyzer"
version = "0.1.0"
description = "Agents that track news, filings and earnings calls for Indian stocks and bullion, and build a point-in-time research database."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.scripts]
sna = "stock_news_analyzer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_news_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: tests that need a running Postgres (skipped when it is unreachable)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
