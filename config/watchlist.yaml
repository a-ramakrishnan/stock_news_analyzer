# Your watchlist. Load or re-load it with: sna watchlist load
# Each stock needs a name; add `symbol:` (NSE symbol) if the name matches more than one company.
# `owned: true` turns on earnings-call tracking for that stock. `quantity` is optional.
# `aliases`: other names the news uses. Short or all-capital aliases match case-sensitively.
# The company name (without "Limited") is always matched, so it needn't be listed.
# `exclude`: phrases that look like this company but are a different one; text matching them
# is ignored when deciding whether an article is about this company.
# `sector_index`: NSE index used as a second benchmark (Nifty 50 is always used). Use the name
# exactly as NSE's index file spells it; `sna prices indices` lists them.
stocks:
  - name: Larsen & Toubro
    owned: true
    aliases: ["L&T"]
    exclude: ["L&T Technology", "L&T Tech", "L&T Finance", "L&T Realty", "L&T Infotech", "LTIMindtree", "LTTS"]
    sector_index: Nifty Infrastructure
  - name: Karur Vysya Bank
    owned: true
    aliases: ["KVB"]
    sector_index: Nifty Bank
  - name: Motherson Sumi Wiring
    owned: true
    aliases: ["MSWIL"]
    sector_index: Nifty Auto
  - name: Knowledge Marine & Engineering Works
    owned: true
    aliases: ["Knowledge Marine", "KMEW"]
    sector_index: Nifty Infrastructure
  - name: BlackBuck
    symbol: BLACKBUCK
    owned: true
    aliases: ["Zinka Logistics"]
    sector_index: Nifty Services Sector
  - name: Diamond Power Infrastructure
    owned: true
    aliases: ["Diamond Power"]
    sector_index: Nifty Infrastructure
  - name: Gaudium IVF and Women Health
    owned: true
    aliases: ["Gaudium IVF", "Gaudium"]
    sector_index: Nifty Healthcare Index
  - name: Gravita India
    owned: true
    aliases: ["Gravita"]
    sector_index: Nifty Metal
  - name: Ujjivan Small Finance Bank
    owned: true
    aliases: ["Ujjivan SFB", "Ujjivan"]
    sector_index: Nifty Financial Services
  - name: Sathlokhar Synergys E&C Global
    symbol: SSEGL
    owned: true
    aliases: ["Sathlokhar"]
    sector_index: Nifty Infrastructure
  - name: Shaily Engineering Plastics
    owned: true
    aliases: ["Shaily"]
    sector_index: Nifty Smallcap 250
  - name: Mrs. Bectors Food Specialities
    owned: false
    aliases: ["Mrs Bectors", "Bectors"]
    sector_index: Nifty FMCG

# Bullion to track: gold and/or silver, e.g.
# bullion:
#   - gold
#   - name: silver
#     owned: true
bullion: []
