name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sna
          POSTGRES_PASSWORD: sna
          POSTGRES_DB: sna
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sna -d sna"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Enable pgvector
        run: PGPASSWORD=sna psql -h localhost -p 5433 -U sna -d sna -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the compose file, including the scheduler service
        run: docker compose --profile scheduler config -q
      - name: Build the app image and run its health check against Postgres
        run: docker compose run --rm --build app
