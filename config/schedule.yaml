# When each job runs, as cron expressions in India time (minute hour day month weekday).
# Used by `sna orchestrator start`. Run any job by hand with `sna run <job>`.
# Set `enabled: false` to pause a job. After editing, restart the orchestrator.
jobs:
  filings:       # new BSE + NSE announcements
    cron: "*/30 7-23 * * *"
  news:          # news feeds + Google News
    cron: "15 6-23 * * *"
  triage:        # LLM (Haiku): relevance, topic, sentiment, importance of new articles
    cron: "25 6-23 * * *"
  prices:        # NSE prices (published around 18:00), corporate actions, moves and labels
    cron: "30 19,21 * * 1-5"
  deals:         # NSE bulk and block deals (published in the evening)
    cron: "0 19,22 * * 1-5"
  xbrl:          # results from NSE's XBRL files (exact figures, no LLM), before the PDF reader
    cron: "15 7 * * *"
  results:       # LLM (Haiku): revenue and profit from results filings, before the order books
    cron: "20 7 * * *"
  events:        # LLM: events from other filings (Haiku), checked by the QA Checker (Sonnet)
    cron: "25 7 * * *"
  explain:       # LLM (Sonnet): likely cause of each unusual day, before the morning digest
    cron: "45 7 * * *"
  concalls:      # LLM (Sonnet): earnings call transcripts of watchlist stocks, before the digest
    cron: "30 7 * * *"
  promises:      # LLM (Sonnet): promises past their date checked against later results
    cron: "40 7 * * *"
  orders:        # LLM: orders from order-win filings (Haiku), quarterly order books (Sonnet)
    cron: "50 7 * * *"
  flags:         # red flags from the events and overdue results (no LLM), before the digest
    cron: "55 7 * * *"
  bullion:       # gold and silver: global prices, the day's split, news; notes on unusual days
    cron: "35 7 * * *"
  themes:        # LLM (Haiku): themes for new events, orders and call points; read-across
    cron: "52 7 * * *"
  securities:    # NSE/BSE company lists (new listings, symbol changes, market caps)
    cron: "0 9 * * 0"
  digest:        # daily report covering everything since the previous digest
    cron: "0 8 * * *"
